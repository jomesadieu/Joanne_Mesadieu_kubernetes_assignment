apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-web-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-web
  template:
    metadata:
      labels:
        app: student-web
    spec:
      containers:
        - name: nginx-container
          image: nginx:alpine
          ports:
            - containerPort: 80
